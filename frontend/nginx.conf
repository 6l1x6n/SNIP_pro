server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Proxy API to backend if frontend and backend in same compose (optional)
    # location /api/ {
    #     proxy_pass http://backend:8001;
    # }
}
