name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend — тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости
        working-directory: frontend
        run: npm ci
      - name: Тесты (vitest: parity токенизатора)
        working-directory: frontend
        run: npx vitest run
      - name: Сборка
        working-directory: frontend
        run: npm run build

  worker:
    name: Worker — типы и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Зависимости
        working-directory: worker
        run: npm ci
      - name: Типы (tsc strict)
        working-directory: worker
        run: npx tsc --noEmit
      - name: Тесты (vitest: jwt, кредиты, values, rewrite)
        working-directory: worker
        run: npx vitest run

  # Оффлайн-линейка качества поиска (eval_search.py) — только локально:
  # нужны ключи эмбеддеров и доступ к прод-воркеру для query-векторов.
  # Перед коммитом изменений поиска/индекса: python3 scripts/eval_search.py
