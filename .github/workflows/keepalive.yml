name: keepalive-render
# Пингуем бэкенд каждые 10 мин, чтобы Render Free не заснул (сон = холодный старт ~50с).
# ВАЖНО: GitHub может задерживать cron-запуски на десятки минут — за это время сервис
# засыпает, и первый пинг уходит на холодный старт и не укладывается в таймаут.
# Поэтому: таймаут 120с + до 5 попыток (первая будит сервис, остальные получают 200).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          url="https://snip-backend-m21d.onrender.com/api/health"
          attempts=5
          for i in $(seq 1 $attempts); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url" || true)
            echo "попытка $i/$attempts: HTTP ${code:-000}"
            [ "$code" = "200" ] && exit 0
            [ "$i" -lt "$attempts" ] && sleep 30
          done
          echo "::error::Бэкенд не вернул 200 после $attempts попыток (последний код: ${code:-нет ответа})"
          exit 1
