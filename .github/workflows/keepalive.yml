name: keepalive-render
# Пингуем бэкенд каждые 10 мин, чтобы Render Free не заснул (сон = холодный старт ~50с)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://snip-backend-m21d.onrender.com/api/health)
          echo "health: $code"
          test "$code" = "200"
