name = "snip-worker"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# D1: создай командой `npx wrangler d1 create snip-db` и вставь database_id ниже
[[d1_databases]]
binding = "DB"
database_name = "snip-db"
database_id = "da22e294-4ec2-4c9c-82b6-b6201c78d147"

[vars]
GROQ_MODEL = "openai/gpt-oss-120b"
EMBED_MODEL = "gemini-embedding-001"
INDEX_BASE_URL = "https://snippy-llm.pages.dev/index"
ALLOWED_ORIGINS = "https://snippy-llm.pages.dev,https://*.pages.dev,http://localhost:5173"
CREDITS_ANON = "30"
CREDITS_USER = "50"
ASK_COST = "10"

# Секреты (не в git): npx wrangler secret put JWT_SECRET / GROQ_API_KEY / GEMINI_API_KEY
